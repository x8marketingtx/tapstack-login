name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  production:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      # vercel pull writes [SENSITIVE] for Sensitive vars. vercel build then bakes that
      # placeholder into the Vite client, so API calls go to /[SENSITIVE]/wp-json on Vercel (405).
      - name: Set public Vite env
        run: |
          WP_URL="https://tap.x8dev.net"
          printf 'VITE_WP_API_URL=%s\n' "$WP_URL" > .env.production
          ENV_FILE=".vercel/.env.production.local"
          if [ -f "$ENV_FILE" ]; then
            grep -vE '^VITE_WP_API_URL=' "$ENV_FILE" > "${ENV_FILE}.tmp" || true
            printf 'VITE_WP_API_URL=%s\n' "$WP_URL" >> "${ENV_FILE}.tmp"
            mv "${ENV_FILE}.tmp" "$ENV_FILE"
          fi
      - name: Build
        env:
          VITE_WP_API_URL: https://tap.x8dev.net
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
